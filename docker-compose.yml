services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_DB: bienvenue
      POSTGRES_USER: bienvenue
      POSTGRES_PASSWORD: bienvenue
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bienvenue"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://bienvenue:bienvenue@postgresql:5432/bienvenue
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  postgresql_data:
