services:
  postgresql:
    image: postgres:16
    environment:
      POSTGRES_DB: bienvenue
      POSTGRES_USER: bienvenue
      POSTGRES_PASSWORD: bienvenue
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bienvenue"]
      interval: 2s
      timeout: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:20.0.1
    command:
      - start-dev
      - --import-realm
      - --hostname-url=http://localhost:8180
      - --hostname-admin-url=http://localhost:8180/
      - --hostname-strict=false
      - --hostname-strict-https=false
      - --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD", "curl", "--head", "-fsS", "http://localhost:8080/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 60

  grist:
    image: gristlabs/grist
    environment:
      APP_HOME_URL: http://localhost:8585
      GRIST_DEFAULT_EMAIL: manager@bienvenue.local
      GRIST_IN_SERVICE: "true"
      # Grist resolves the org from the request's Host header. Calls made from
      # inside the Docker network use the "grist" service name, which isn't a
      # recognized domain, so pin a single fixed org instead ("Domain not
      # recognized: grist" otherwise).
      GRIST_SINGLE_ORG: docs-5
    volumes:
      - grist_data:/persist
    ports:
      - "8585:8484"

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate && python manage.py seed_demo_data && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DJANGO_ENVIRONMENT: development
      DATABASE_URL: postgres://bienvenue:bienvenue@postgresql:5432/bienvenue
      OIDC_RP_CLIENT_ID: bienvenue-lasuite
      OIDC_RP_CLIENT_SECRET: ThisIsAnExampleKeyForDevPurposeOnly
      OIDC_OP_AUTHORIZATION_ENDPOINT: http://localhost:8180/realms/bienvenue-lasuite/protocol/openid-connect/auth
      OIDC_OP_TOKEN_ENDPOINT: http://keycloak:8080/realms/bienvenue-lasuite/protocol/openid-connect/token
      OIDC_OP_USER_ENDPOINT: http://keycloak:8080/realms/bienvenue-lasuite/protocol/openid-connect/userinfo
      OIDC_OP_JWKS_ENDPOINT: http://keycloak:8080/realms/bienvenue-lasuite/protocol/openid-connect/certs
      GRIST_BASE_URL: http://grist:8484
      GRIST_DOC_ID: 2ukGv1AtPNK3vmfWRSBLGw
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8000
      - VITE_GRIST_URL=http://localhost:8585
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgresql_data:
  grist_data:
